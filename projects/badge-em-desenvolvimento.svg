<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Selo: em desenvolvimento</title>
<desc>Selo circular estilo carimbo indicando que o projeto ainda está em desenvolvimento</desc>
<defs>
  <path id="arcTop" d="M 34,110 A 76,76 0 0 1 186,110" fill="none"/>
  <path id="arcBottom" d="M 44,138 A 66,66 0 0 0 176,138" fill="none"/>
</defs>
<g transform="rotate(-7 110 110)">
  <circle cx="110" cy="110" r="98" fill="none" stroke="#8b2635" stroke-width="2" stroke-dasharray="3 5" opacity="0.9"/>
  <circle cx="110" cy="110" r="86" fill="none" stroke="#c9a35c" stroke-width="1" opacity="0.55"/>
  <circle cx="110" cy="110" r="80" fill="none" stroke="#c9a35c" stroke-width="0.5" opacity="0.35"/>

  <text font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing="3" fill="#c9a35c">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">EM DESENVOLVIMENTO</textPath>
  </text>

  <g transform="translate(110 96)">
    <circle r="24" fill="none" stroke="#ece7db" stroke-width="0.75" opacity="0.8"/>
    <path d="M -8,-2 L 0,-10 L 8,-2 L 8,10 L -8,10 Z" fill="none" stroke="#ece7db" stroke-width="1" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="0" cy="2" r="3" fill="none" stroke="#ece7db" stroke-width="1" opacity="0.85"/>
    <line x1="0" y1="5" x2="0" y2="9" stroke="#ece7db" stroke-width="1" opacity="0.85"/>
  </g>

  <text font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#948d9f">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">CASO EM ABERTO</textPath>
